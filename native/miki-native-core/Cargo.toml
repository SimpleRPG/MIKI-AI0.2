[package]
name = "miki-native-core"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "miki_native_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = "0.21.1"
sha2 = "0.10.8"
sha1 = "0.10.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
