name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install -D @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MIKI-AI Studio" "com.mikiai.app" --web-dir "dist"
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mikiai.app",
            "appName": "MIKI-AI Game Studio",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          
          # AndroidManifestに largeHeap="true" (メモリ制限解除・最大RAM解放) を自動注入
          sed -i 's/<application/<application android:largeHeap="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          echo "Injected largeHeap and hardwareAccelerated into AndroidManifest.xml"

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miki-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
