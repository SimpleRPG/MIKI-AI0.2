name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK 21 with setup-java v5
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Web Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Verify Android Japanese morphology contract
        run: npm run android:verify-japanese-contract

      - name: Build Web Application
        run: npm run build

      - name: Configure Capacitor & Generate Android Native
        run: |
          rm -rf android capacitor.config.ts capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.miki.ai",
            "appName": "MIKI-AI",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          bash scripts/install_android_japanese_morphology.sh
          npx cap sync android

          mkdir -p android/app/src/main/assets
          cp model_manifest.json android/app/src/main/assets/model_manifest.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent signing keystore
        working-directory: android
        run: |
          echo "${{ secrets.MIKI_KEYSTORE_BASE64 }}" | base64 -d > app/miki-ai-release.keystore

      - name: Build Android APK
        working-directory: android
        env:
          MIKI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/miki-ai-release.keystore
          MIKI_KEYSTORE_PASSWORD: ${{ secrets.MIKI_KEYSTORE_PASSWORD }}
          MIKI_KEY_ALIAS: ${{ secrets.MIKI_KEY_ALIAS }}
          MIKI_KEY_PASSWORD: ${{ secrets.MIKI_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miki-ai-native-gpu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
