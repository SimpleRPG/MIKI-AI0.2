name: Build Android APK (Native GPU OpenCL / Vulkan Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK 21 with setup-java v5
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Environment Specs from Model Manifest (Chapter 78)
        id: manifest
        run: |
          NDK_VER=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.ndkVersion || '26.1.10909125');")
          echo "ndk_version=${NDK_VER}" >> $GITHUB_OUTPUT
          echo "Manifest NDK version: ${NDK_VER}"

      - name: Install Android SDK Build-Tools, NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;${{ steps.manifest.outputs.ndk_version }}"
          yes | sdkmanager --licenses || true

      - name: Install Vulkan Build Tools (glslc shader compiler for GGML_VULKAN)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          glslc --version || true

      - name: Install Web Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Configure Capacitor & Generate Android Native llama.cpp GGUF Bridge
        run: |
          rm -rf android capacitor.config.ts capacitor.config.js
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mikiai.app",
            "appName": "MIKI-AI Game Studio",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

          # Read native build specifications from model_manifest.json (Chapter 78: Model Manifest Source of Truth)
          echo "Connecting build process to model_manifest.json..."
          LLAMA_REPO=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.repository || 'https://github.com/ggml-org/llama.cpp.git');")
          LLAMA_COMMIT=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.pinnedCommit || 'b4600');")
          LLAMA_COMMIT_HASH=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.pinnedCommitHash || '');")
          VULKAN_REPO=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.vulkanHeaders?.repository || 'https://github.com/KhronosGroup/Vulkan-Headers.git');")
          VULKAN_TAG=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.vulkanHeaders?.pinnedTag || 'v1.3.296');")
          SPIRV_REPO=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.spirvHeaders?.repository || 'https://github.com/KhronosGroup/SPIRV-Headers.git');")
          SPIRV_TAG=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.spirvHeaders?.pinnedTag || 'vulkan-sdk-1.3.296.0');")
          NDK_TARGET=$(node -e "const m = require('./model_manifest.json'); console.log(m.nativeEnvironment?.ndkVersion || '26.1.10909125');")
          CMAKE_ARGUMENTS_JSON=$(node -e "const m = require('./model_manifest.json'); console.log(JSON.stringify(m.nativeEnvironment?.cmakeFlags || []));")
          CMAKE_ARGUMENTS_GRADLE=$(node -e "const m = require('./model_manifest.json'); console.log((m.nativeEnvironment?.cmakeFlags || []).map(f => '\"' + f + '\"').join(', '));")

          echo "Manifest Target NDK: $NDK_TARGET"
          echo "Manifest llama.cpp commit: $LLAMA_COMMIT ($LLAMA_COMMIT_HASH)"
          echo "Manifest Vulkan-Headers: $VULKAN_TAG ($VULKAN_REPO)"
          echo "Manifest SPIRV-Headers: $SPIRV_TAG ($SPIRV_REPO)"

          # Copy model_manifest.json into android assets directory so the app can verify manifest at runtime
          mkdir -p android/app/src/main/assets
          cp model_manifest.json android/app/src/main/assets/model_manifest.json

          # Detect NDK Directory based on target from manifest
          NDK_DIR=""
          if [ -d "$ANDROID_SDK_ROOT/ndk/$NDK_TARGET" ]; then
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_TARGET"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi

          echo "Detected NDK path: $NDK_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          if [ -n "$NDK_DIR" ]; then
            echo "ndk.dir=$NDK_DIR" >> android/local.properties
          fi

          # Clone llama.cpp pinned to model_manifest.json commit and verify commit hash
          mkdir -p android/app/src/main/cpp
          git clone "$LLAMA_REPO" android/app/src/main/cpp/llama.cpp
          cd android/app/src/main/cpp/llama.cpp
          git checkout "$LLAMA_COMMIT"
          if [ -n "$LLAMA_COMMIT_HASH" ]; then
            echo "Verifying and locking llama.cpp exact commit hash: $LLAMA_COMMIT_HASH"
            git reset --hard "$LLAMA_COMMIT_HASH"
          fi
          echo "Llama.cpp checked out at: $(git rev-parse HEAD)"
          cd ../../../../

          # Clone Vulkan-Headers using version pinned in model_manifest.json
          git clone --depth 1 --branch "$VULKAN_TAG" "$VULKAN_REPO" android/app/src/main/cpp/Vulkan-Headers

          # Clone and install SPIRV-Headers using version pinned in model_manifest.json
          git clone --depth 1 --branch "$SPIRV_TAG" "$SPIRV_REPO" android/app/src/main/cpp/SPIRV-Headers
          cmake -S android/app/src/main/cpp/SPIRV-Headers -B /tmp/spirv-headers-build \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/android/app/src/main/cpp/spirv-headers-install
          cmake --build /tmp/spirv-headers-build --target install

          # Create CMakeLists.txt for compiling libllama_jni.so
          cat << 'EOF' > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(llama_jni LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_C_STANDARD 11)

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "Build static" FORCE)
          set(GGML_OPENMP OFF CACHE BOOL "Disable OpenMP for Android stability" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "Disable examples" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "Disable tests" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "Disable server" FORCE)

          # Enable the Vulkan backend so ggml can offload layers to the device's
          # own GPU (Adreno / Mali / PowerVR) at runtime. glslc (host tool, apt-installed)
          # compiles the compute shaders; Vulkan-Headers supplies vulkan.hpp which the
          # NDK does not ship. If no Vulkan driver is present on the phone, ggml
          # transparently falls back to the CPU backend at runtime.
          set(GGML_VULKAN ON CACHE BOOL "Enable Vulkan GPU backend" FORCE)
          set(Vulkan_INCLUDE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Vulkan-Headers/include CACHE PATH "Vulkan headers with C++ bindings" FORCE)
          add_compile_definitions(VK_USE_PLATFORM_ANDROID_KHR)

          # SPIRV-Headers was built+installed for the HOST above (not under the NDK
          # sysroot), so we must both point find_package() at it AND allow package
          # lookups outside CMAKE_FIND_ROOT_PATH, which the Android toolchain file
          # restricts to sysroot-only (ONLY) by default.
          list(APPEND CMAKE_PREFIX_PATH ${CMAKE_CURRENT_SOURCE_DIR}/spirv-headers-install)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)

          # Belt-and-suspenders: the SPIRV-Headers package config was found, but its
          # imported target does not appear to propagate INTERFACE_INCLUDE_DIRECTORIES
          # to ggml-vulkan's compile command (fatal error: 'spirv/unified1/spirv.hpp'
          # file not found). include_directories() here applies to every target added
          # via the add_subdirectory() below, so this guarantees the header is found
          # regardless of how the package's own target wiring behaves.
          include_directories(${CMAKE_CURRENT_SOURCE_DIR}/SPIRV-Headers/include)

          add_subdirectory(${CMAKE_CURRENT_SOURCE_DIR}/llama.cpp llama_build EXCLUDE_FROM_ALL)

          add_library(llama_jni SHARED
              llama_jni.cpp
          )

          target_include_directories(llama_jni PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/llama.cpp/include
              ${CMAKE_CURRENT_SOURCE_DIR}/llama.cpp/ggml/include
          )

          target_link_libraries(llama_jni PRIVATE
              llama
              android
              log
              vulkan
          )
          EOF

          # Create llama_jni.cpp (Real JNI Bridge calling llama.cpp runtime directly)
          cat << 'EOF' > android/app/src/main/cpp/llama_jni.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <cstring>
          #include <android/log.h>
          #include "llama.h"

          #define TAG "LlamaJNI"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          static llama_model* g_model = nullptr;
          static const llama_vocab* g_vocab = nullptr;
          static llama_context* g_ctx = nullptr;
          static llama_sampler* g_smpl = nullptr;

          extern "C" {

          JNIEXPORT jboolean JNICALL
          Java_com_mikiai_app_MlcLlmPlugin_nativeInitModel(
              JNIEnv* env, jobject thiz, jstring jModelPath, jint nGpuLayers, jint nCtx, jint nThreads) {

              if (!jModelPath) {
                  LOGE("nativeInitModel: jModelPath is null");
                  return JNI_FALSE;
              }

              const char* modelPath = env->GetStringUTFChars(jModelPath, nullptr);
              if (!modelPath) {
                  LOGE("nativeInitModel: Failed to get modelPath string");
                  return JNI_FALSE;
              }

              LOGI("Loading GGUF model from %s (gpu_layers: %d, ctx: %d, threads: %d)", modelPath, nGpuLayers, nCtx, nThreads);

              if (g_ctx) {
                  llama_free(g_ctx);
                  g_ctx = nullptr;
              }
              if (g_smpl) {
                  llama_sampler_free(g_smpl);
                  g_smpl = nullptr;
              }
              if (g_model) {
                  llama_model_free(g_model);
                  g_model = nullptr;
                  g_vocab = nullptr;
              }

              llama_backend_init();

              llama_model_params model_params = llama_model_default_params();
              model_params.n_gpu_layers = nGpuLayers;

              g_model = llama_model_load_from_file(modelPath, model_params);
              if (!g_model) {
                  LOGE("Failed to load model from file: %s", modelPath);
                  env->ReleaseStringUTFChars(jModelPath, modelPath);
                  return JNI_FALSE;
              }
              env->ReleaseStringUTFChars(jModelPath, modelPath);
              g_vocab = llama_model_get_vocab(g_model);

              llama_context_params ctx_params = llama_context_default_params();
              ctx_params.n_ctx = nCtx > 0 ? nCtx : 2048;
              ctx_params.n_threads = nThreads > 0 ? nThreads : 4;
              ctx_params.n_threads_batch = ctx_params.n_threads;

              g_ctx = llama_init_from_model(g_model, ctx_params);
              if (!g_ctx) {
                  LOGE("Failed to create llama context");
                  llama_model_free(g_model);
                  g_model = nullptr;
                  g_vocab = nullptr;
                  return JNI_FALSE;
              }

              LOGI("GGUF model loaded successfully into native context (n_ctx: %d, threads: %d)!", ctx_params.n_ctx, ctx_params.n_threads);
              return JNI_TRUE;
          }

          JNIEXPORT jstring JNICALL
          Java_com_mikiai_app_MlcLlmPlugin_nativeGenerateToken(
              JNIEnv* env, jobject thiz, jstring jPrompt, jfloat temp, jfloat topP, jint maxTokens, jobject callback) {

              if (!g_ctx || !g_model) {
                  return env->NewStringUTF("Error: Native model is not loaded in memory");
              }
              if (!jPrompt) {
                  return env->NewStringUTF("Error: Prompt string is null");
              }

              const char* prompt = env->GetStringUTFChars(jPrompt, nullptr);
              if (!prompt) {
                  return env->NewStringUTF("Error: Failed to obtain prompt UTF-8 characters");
              }

              int n_prompt_neg = llama_tokenize(g_vocab, prompt, (int32_t)strlen(prompt), NULL, 0, true, true);
              int n_prompt = n_prompt_neg < 0 ? -n_prompt_neg : n_prompt_neg;
              if (n_prompt <= 0) n_prompt = 1;

              std::vector<llama_token> prompt_tokens(n_prompt + 16);
              int n_tokens = llama_tokenize(g_vocab, prompt, (int32_t)strlen(prompt), prompt_tokens.data(), (int32_t)prompt_tokens.size(), true, true);
              env->ReleaseStringUTFChars(jPrompt, prompt);

              if (n_tokens < 0) {
                  return env->NewStringUTF("Error: Tokenization failed");
              }
              prompt_tokens.resize(n_tokens);

              // 構文サンプラーを実行時指定の temperature & topP で再構築
              if (g_smpl) {
                  llama_sampler_free(g_smpl);
                  g_smpl = nullptr;
              }
              llama_sampler_chain_params sparams = llama_sampler_chain_default_params();
              g_smpl = llama_sampler_chain_init(sparams);
              float effTemp = temp > 0.0f ? temp : 0.7f;
              float effTopP = (topP > 0.0f && topP <= 1.0f) ? topP : 0.9f;
              llama_sampler_chain_add(g_smpl, llama_sampler_init_temp(effTemp));
              llama_sampler_chain_add(g_smpl, llama_sampler_init_top_p(effTopP, 1));
              llama_sampler_chain_add(g_smpl, llama_sampler_init_dist(LLAMA_DEFAULT_SEED));

              llama_memory_clear(llama_get_memory(g_ctx), true);

              llama_batch batch = llama_batch_get_one(prompt_tokens.data(), (int32_t)prompt_tokens.size());
              if (llama_decode(g_ctx, batch) != 0) {
                  return env->NewStringUTF("Error: llama_decode prompt failed");
              }

              jclass cbClass = env->GetObjectClass(callback);
              jmethodID onChunkMethod = env->GetMethodID(cbClass, "onChunk", "(Ljava/lang/String;)Z");

              std::string full_response = "";
              int n_decode = 0;

              while (n_decode < maxTokens) {
                  llama_token new_token_id = llama_sampler_sample(g_smpl, g_ctx, -1);
                  llama_sampler_accept(g_smpl, new_token_id);

                  if (llama_vocab_is_eog(g_vocab, new_token_id) || new_token_id == llama_vocab_eos(g_vocab)) {
                      break;
                  }

                  char buf[256];
                  int n = llama_token_to_piece(g_vocab, new_token_id, buf, sizeof(buf), 0, true);
                  if (n < 0) break;
                  std::string piece(buf, n);
                  full_response += piece;

                  jstring jPiece = env->NewStringUTF(piece.c_str());
                  jboolean keepGoing = env->CallBooleanMethod(callback, onChunkMethod, jPiece);
                  env->DeleteLocalRef(jPiece);
                  if (!keepGoing) break;

                  batch = llama_batch_get_one(&new_token_id, 1);
                  if (llama_decode(g_ctx, batch) != 0) {
                      break;
                  }
                  n_decode++;
              }

              return env->NewStringUTF(full_response.c_str());
          }

          JNIEXPORT void JNICALL
          Java_com_mikiai_app_MlcLlmPlugin_nativeFreeModel(JNIEnv* env, jobject thiz) {
              if (g_smpl) {
                  llama_sampler_free(g_smpl);
                  g_smpl = nullptr;
              }
              if (g_ctx) {
                  llama_free(g_ctx);
                  g_ctx = nullptr;
              }
              if (g_model) {
                  llama_model_free(g_model);
                  g_model = nullptr;
                  g_vocab = nullptr;
              }
              llama_backend_free();
              LOGI("Native model freed from memory");
          }

          }
          EOF

          # Configure build.gradle with CMake externalNativeBuild
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.mikiai.app"
              compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
              ndkVersion "__MANIFEST_NDK_VERSION__"

              defaultConfig {
                  applicationId "com.mikiai.app"
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
                  versionCode 10400
                  versionName "1.0.4"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                       ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
                  ndk {
                      abiFilters 'arm64-v8a', 'x86_64'
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags "-O3 -fexceptions -frtti"
                          arguments __MANIFEST_CMAKE_ARGS__
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
                  resources {
                      excludes += '/META-INF/{AL2.0,LGPL2.1}'
                  }
              }
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }
              }
          }

          repositories {
              google()
              mavenCentral()
              maven { url 'https://jitpack.io' }
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'androidx.work:work-runtime:2.9.0'
          }

          apply from: 'capacitor.build.gradle'
          EOF

          # Substitute exact values parsed from model_manifest.json (Chapter 78)
          sed -i "s/__MANIFEST_NDK_VERSION__/${NDK_TARGET}/g" android/app/build.gradle
          sed -i "s/__MANIFEST_CMAKE_ARGS__/${CMAKE_ARGUMENTS_GRADLE}/g" android/app/build.gradle

          # Create MlcLlmPlugin.java (Full Real llama.cpp JNI Plugin & GGUF Model Downloader)
          cat << 'EOF' > android/app/src/main/java/com/mikiai/app/MlcLlmPlugin.java
          package com.mikiai.app;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.StatFs;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicBoolean;
          import okhttp3.Call;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "MlcLlmPlugin")
          public class MlcLlmPlugin extends Plugin {
              private static boolean isNativeLibLoaded = false;
              static {
                  try {
                      System.loadLibrary("llama_jni");
                      isNativeLibLoaded = true;
                  } catch (UnsatisfiedLinkError e) {
                      android.util.Log.e("MlcLlmPlugin", "Failed to load llama_jni library: " + e.getMessage());
                  }
              }

              // Native C++ JNI declarations
              public native boolean nativeInitModel(String modelPath, int nGpuLayers, int nCtx, int nThreads);
              public native String nativeGenerateToken(String prompt, float temp, float topP, int maxTokens, TokenCallback callback);
              public native void nativeFreeModel();

              public interface TokenCallback {
                  boolean onChunk(String chunk);
              }

              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final OkHttpClient httpClient = new OkHttpClient();

              private String currentModelId = null;
              private String currentModelPath = null;
              private boolean isModelLoaded = false;
              private final AtomicBoolean isGenerating = new AtomicBoolean(false);
              private Call currentDownloadCall = null;

              private File getModelsDirectory() {
                  Context context = getContext();
                  File dir = new File(context.getFilesDir(), "models");
                  if (!dir.exists()) {
                      dir.mkdirs();
                  }
                  return dir;
              }

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("available", isNativeLibLoaded);
                  ret.put("backend", isNativeLibLoaded ? "llama.cpp (C++ NDK Native / Vulkan GPU)" : "Unavailable");
                  ret.put("platform", "android-native");
                  ret.put("architecture", Build.SUPPORTED_ABIS != null && Build.SUPPORTED_ABIS.length > 0 ? Build.SUPPORTED_ABIS[0] : "arm64-v8a");
                  call.resolve(ret);
              }

              @PluginMethod
              public void getHardwareSpecs(PluginCall call) {
                  JSObject stats = new JSObject();
                  Context context = getContext();

                  long totalMemoryMB = 4096;
                  long availableMemoryMB = 2048;
                  if (context != null) {
                      ActivityManager actManager = (ActivityManager) context.getSystemService(Context.ACTIVITY_SERVICE);
                      if (actManager != null) {
                          ActivityManager.MemoryInfo memInfo = new ActivityManager.MemoryInfo();
                          actManager.getMemoryInfo(memInfo);
                          totalMemoryMB = memInfo.totalMem / (1024 * 1024);
                          availableMemoryMB = memInfo.availMem / (1024 * 1024);
                      }
                  }

                  stats.put("available", isNativeLibLoaded);
                  stats.put("backend", "llama.cpp JNI Native (Vulkan GPU, CPU fallback)");
                  stats.put("gpuVendor", Build.MANUFACTURER);
                  stats.put("gpuRenderer", Build.MODEL + " (" + (Build.HARDWARE != null ? Build.HARDWARE : "Native") + ")");
                  stats.put("totalMemoryMB", totalMemoryMB);
                  stats.put("availableMemoryMB", availableMemoryMB);
                  stats.put("allocatedMemoryMB", isModelLoaded ? 800 : 0);
                  stats.put("isNative", true);
                  stats.put("deviceModel", Build.MANUFACTURER + " " + Build.MODEL);
                  call.resolve(stats);
              }

              @PluginMethod
              public void getStorageInfo(PluginCall call) {
                  File dir = getModelsDirectory();
                  File[] files = dir.listFiles();
                  long totalSize = 0;
                  JSArray fileList = new JSArray();

                  if (files != null) {
                      for (File f : files) {
                          if (f.isFile() && f.getName().endsWith(".gguf")) {
                              totalSize += f.length();
                              JSObject fo = new JSObject();
                              fo.put("name", f.getName());
                              fo.put("sizeMB", Math.round((double) f.length() / (1024.0 * 1024.0) * 10.0) / 10.0);
                              fo.put("lastModified", f.lastModified());
                              fileList.put(fo);
                          }
                      }
                  }

                  StatFs stat = new StatFs(Environment.getDataDirectory().getPath());
                  long freeBytes = stat.getAvailableBlocksLong() * stat.getBlockSizeLong();
                  long totalBytes = stat.getBlockCountLong() * stat.getBlockSizeLong();

                  JSObject ret = new JSObject();
                  ret.put("usedByModelsMB", Math.round((double) totalSize / (1024.0 * 1024.0) * 10.0) / 10.0);
                  ret.put("freeDiskMB", Math.round((double) freeBytes / (1024.0 * 1024.0)));
                  ret.put("totalDiskMB", Math.round((double) totalBytes / (1024.0 * 1024.0)));
                  ret.put("modelsDir", dir.getAbsolutePath());
                  ret.put("files", fileList);
                  call.resolve(ret);
              }

              @PluginMethod
              public void downloadModel(PluginCall call) {
                  String downloadUrl = call.getString("downloadUrl");
                  String fileName = call.getString("fileName");
                  String modelId = call.getString("modelId", fileName);

                  if (downloadUrl == null || downloadUrl.isEmpty() || fileName == null || fileName.isEmpty()) {
                      call.reject("downloadUrl and fileName are required");
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          File dir = getModelsDirectory();
                          File targetFile = new File(dir, fileName);
                          File tempFile = new File(dir, fileName + ".download");

                          Request request = new Request.Builder().url(downloadUrl).build();
                          currentDownloadCall = httpClient.newCall(request);
                          Response response = currentDownloadCall.execute();

                          if (!response.isSuccessful()) {
                              call.reject("Download HTTP failed with status: " + response.code());
                              return;
                          }

                          long totalBytes = response.body().contentLength();
                          InputStream is = response.body().byteStream();
                          FileOutputStream fos = new FileOutputStream(tempFile);

                          byte[] buffer = new byte[64 * 1024];
                          long bytesReadSoFar = 0;
                          int read;
                          long startTime = System.currentTimeMillis();
                          long lastNotifyTime = 0;

                          while ((read = is.read(buffer)) != -1) {
                              fos.write(buffer, 0, read);
                              bytesReadSoFar += read;

                              long now = System.currentTimeMillis();
                              if (now - lastNotifyTime > 150) {
                                  lastNotifyTime = now;
                                  final long bytesDownloadedSnapshot = bytesReadSoFar;
                                  final float progress = totalBytes > 0 ? (float) bytesDownloadedSnapshot / (float) totalBytes : 0.0f;
                                  double elapsedSec = Math.max(0.1, (now - startTime) / 1000.0);
                                  final double speedMBs = ((double) bytesDownloadedSnapshot / (1024.0 * 1024.0)) / elapsedSec;
                                  final double etaSec = totalBytes > 0 && speedMBs > 0 ? ((totalBytes - bytesDownloadedSnapshot) / (1024.0 * 1024.0)) / speedMBs : 0;
                                  final long totalBytesSnapshot = totalBytes;

                                  mainHandler.post(() -> {
                                      JSObject progressData = new JSObject();
                                      progressData.put("progress", progress);
                                      progressData.put("bytesDownloaded", bytesDownloadedSnapshot);
                                      progressData.put("totalBytes", totalBytesSnapshot);
                                      progressData.put("speedMBs", Math.round(speedMBs * 10.0) / 10.0);
                                      progressData.put("etaSeconds", Math.round(etaSec));
                                      progressData.put("fileName", fileName);
                                      progressData.put("modelId", modelId);
                                      notifyListeners("onProgress", progressData);
                                  });
                              }
                          }

                          fos.flush();
                          fos.close();
                          is.close();

                          if (tempFile.renameTo(targetFile)) {
                              JSObject ret = new JSObject();
                              ret.put("success", true);
                              ret.put("filePath", targetFile.getAbsolutePath());
                              ret.put("sizeMB", Math.round((double) targetFile.length() / (1024.0 * 1024.0) * 10.0) / 10.0);
                              call.resolve(ret);
                          } else {
                              call.reject("Failed to finalize downloaded model file");
                          }
                      } catch (Exception e) {
                          call.reject("Download error: " + e.getMessage());
                      } finally {
                          currentDownloadCall = null;
                      }
                  });
              }

              @PluginMethod
              public void cancelDownload(PluginCall call) {
                  if (currentDownloadCall != null) {
                      currentDownloadCall.cancel();
                      currentDownloadCall = null;
                  }
                  JSObject ret = new JSObject();
                  ret.put("cancelled", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void deleteModel(PluginCall call) {
                  String fileName = call.getString("fileName");
                  if (fileName == null || fileName.isEmpty()) {
                      call.reject("fileName is required");
                      return;
                  }

                  File target = new File(getModelsDirectory(), fileName);
                  if (target.exists()) {
                      if (currentModelPath != null && currentModelPath.equals(target.getAbsolutePath())) {
                          unloadModelInternal();
                      }
                      boolean deleted = target.delete();
                      JSObject ret = new JSObject();
                      ret.put("success", deleted);
                      call.resolve(ret);
                  } else {
                      JSObject ret = new JSObject();
                      ret.put("success", false);
                      ret.put("message", "File not found");
                      call.resolve(ret);
                  }
              }

              @PluginMethod
              public void loadModel(PluginCall call) {
                  String fileName = call.getString("fileName");
                  String modelId = call.getString("modelId", fileName);
                  int nGpuLayers = call.getInt("nGpuLayers", 99);
                  int nCtx = call.getInt("nCtx", 2048);
                  int nThreads = call.getInt("nThreads", 4);

                  if (fileName == null || fileName.isEmpty()) {
                      call.reject("fileName is required");
                      return;
                  }

                  File modelFile = new File(getModelsDirectory(), fileName);
                  if (!modelFile.exists()) {
                      call.reject("GGUFモデルファイル (" + fileName + ") が端末ストレージに存在しません。先にダウンロードしてください。");
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          if (!isNativeLibLoaded) {
                              call.reject("llama.cpp JNIネイティブライブラリがロードされていません");
                              return;
                          }

                          mainHandler.post(() -> {
                              JSObject p = new JSObject();
                              p.put("progress", 0.3f);
                              p.put("text", "GGUFモデル重みファイルをVRAM/RAMにマッピング中...");
                              notifyListeners("onProgress", p);
                          });

                          boolean success = nativeInitModel(modelFile.getAbsolutePath(), nGpuLayers, nCtx, nThreads);

                          if (success) {
                              currentModelId = modelId;
                              currentModelPath = modelFile.getAbsolutePath();
                              isModelLoaded = true;

                              mainHandler.post(() -> {
                                  JSObject p = new JSObject();
                                  p.put("progress", 1.0f);
                                  p.put("text", "モデルロード完了 (推論可能)");
                                  notifyListeners("onProgress", p);
                              });

                              JSObject ret = new JSObject();
                              ret.put("success", true);
                              ret.put("modelId", modelId);
                              ret.put("backend", "llama.cpp (C++ JNI Native)");
                              call.resolve(ret);
                          } else {
                              call.reject("llama.cpp によるGGUFモデルの初期化に失敗しました。ファイル破損の可能性があります。");
                          }
                      } catch (Exception e) {
                          call.reject("Model load error: " + e.getMessage());
                      }
                  });
              }

              @PluginMethod
              public void generateStream(PluginCall call) {
                  if (!isModelLoaded || !isNativeLibLoaded) {
                      call.reject("Native GGUF model is not loaded in memory. Please download and load the model first.");
                      return;
                  }

                  JSArray messagesArray = call.getArray("messages");
                  double temperature = call.getDouble("temperature", 0.7);
                  double topP = call.getDouble("topP", 0.9);
                  int maxTokens = call.getInt("maxTokens", 512);

                  executor.execute(() -> {
                      try {
                          isGenerating.set(true);
                          long startTime = System.currentTimeMillis();

                          StringBuilder chatPrompt = new StringBuilder();
                          if (messagesArray != null) {
                              for (int i = 0; i < messagesArray.length(); i++) {
                                  JSONObject msg = messagesArray.getJSONObject(i);
                                  String role = msg.optString("role", "user");
                                  String content = msg.optString("content", "");
                                  chatPrompt.append("<|im_start|>").append(role).append("\n").append(content).append("<|im_end|>\n");
                              }
                          }
                          chatPrompt.append("<|im_start|>assistant\n");

                          StringBuilder fullResult = new StringBuilder();
                          final int[] tokenCount = {0};

                          String result = nativeGenerateToken(
                              chatPrompt.toString(),
                              (float) temperature,
                              (float) topP,
                              maxTokens,
                              new TokenCallback() {
                                  @Override
                                  public boolean onChunk(String chunk) {
                                      if (!isGenerating.get()) return false;
                                      fullResult.append(chunk);
                                      tokenCount[0]++;

                                      final String currentChunk = chunk;
                                      final String currentFull = fullResult.toString();
                                      final int currentCount = tokenCount[0];

                                      mainHandler.post(() -> {
                                          JSObject streamChunk = new JSObject();
                                          streamChunk.put("delta", currentChunk);
                                          streamChunk.put("fullText", currentFull);
                                          streamChunk.put("tokensGenerated", currentCount);
                                          notifyListeners("onStreamChunk", streamChunk);
                                      });
                                      return true;
                                  }
                              }
                          );

                          // ⚠️ CRITICAL - DO NOT REMOVE: この nativeGenerateToken の Error: チェックブロックを削除すると
                          // C++側の初期化・デコード失敗などのエラーが握り潰され、空文字または正常終了として誤処理されます。
                          // ファイル全体を再生成する場合も、このブロックだけは必ず引き継いでください。
                          if (result != null && result.startsWith("Error:")) {
                              call.reject(result);
                              return;
                          }

                          long duration = Math.max(1, System.currentTimeMillis() - startTime);
                          float tps = (float) tokenCount[0] / (duration / 1000.0f);

                          JSObject res = new JSObject();
                          res.put("text", fullResult.toString());
                          res.put("totalTokens", tokenCount[0]);
                          res.put("tps", Math.round(tps * 10.0f) / 10.0f);
                          call.resolve(res);

                      } catch (Exception e) {
                          call.reject("Native generation error: " + e.getMessage());
                      } finally {
                          isGenerating.set(false);
                      }
                  });
              }

              private void unloadModelInternal() {
                  if (isNativeLibLoaded && isModelLoaded) {
                      try {
                          nativeFreeModel();
                      } catch (Exception ignored) {}
                  }
                  isGenerating.set(false);
                  isModelLoaded = false;
                  currentModelId = null;
                  currentModelPath = null;
              }

              @PluginMethod
              public void unloadModel(PluginCall call) {
                  unloadModelInternal();
                  JSObject ret = new JSObject();
                  ret.put("success", true);
                  call.resolve(ret);
              }

              @PluginMethod
              public void getMemoryInfo(PluginCall call) {
                  try {
                      ActivityManager actManager = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo memInfo = new ActivityManager.MemoryInfo();
                      if (actManager != null) {
                          actManager.getMemoryInfo(memInfo);
                      }

                      StatFs stat = new StatFs(Environment.getDataDirectory().getPath());
                      long bytesAvailable = stat.getBlockSizeLong() * stat.getAvailableBlocksLong();
                      long bytesTotal = stat.getBlockSizeLong() * stat.getBlockCountLong();

                      JSObject ret = new JSObject();
                      ret.put("totalMemMB", Math.round((double) memInfo.totalMem / (1024.0 * 1024.0)));
                      ret.put("availMemMB", Math.round((double) memInfo.availMem / (1024.0 * 1024.0)));
                      ret.put("thresholdMB", Math.round((double) memInfo.threshold / (1024.0 * 1024.0)));
                      ret.put("lowMemory", memInfo.lowMemory);
                      ret.put("storageAvailMB", Math.round((double) bytesAvailable / (1024.0 * 1024.0)));
                      ret.put("storageTotalMB", Math.round((double) bytesTotal / (1024.0 * 1024.0)));
                      ret.put("cpuCores", Runtime.getRuntime().availableProcessors());
                      ret.put("isMeasuredReal", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Failed to get memory info: " + e.getMessage());
                  }
              }
          }
