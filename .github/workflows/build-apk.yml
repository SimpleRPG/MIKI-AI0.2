name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Set Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Verify current tracked source inventory P299
        run: python scripts/audit_current_source_inventory_p299.py --check

      - name: Verify user-facing CORE wording and local API routing P330
        run: node scripts/verify_user_facing_runtime_language_p330.mjs

      - name: Verify research provenance and learning gates P331
        run: node scripts/verify_research_learning_integrity_p331.mjs

      - name: Verify shared research provenance and Evidence status P334
        run: node scripts/verify_research_learning_integrity_p334.mjs

      - name: Verify system diagnostic report template syntax P336
        run: node scripts/verify_system_logger_diagnostic_template_p336.mjs

      - name: Verify web content understanding
        run: npx tsx scripts/verify_web_content_understanding.ts

      - name: Verify evidence-backed web semantic rule learning
        run: npx tsx scripts/verify_web_semantic_rule_learning.ts

      - name: Verify conversation and work-instruction failure recovery
        run: npx tsx scripts/verify_task_route_failure_contracts.ts

      - name: Verify unified self-coding candidate and file validation P321
        run: npm run verify:unified-candidate-pipeline:p321

      - name: Verify cognitive graph node identity and conversation edges
        timeout-minutes: 10
        run: |
          npm run verify:core-cognitive-graph:p155
          npm run verify:cross-domain-graph:p211
          npm run verify:conversation-graph-runtime:p212
          npm run verify:conversation-components:p213
          npm run verify:conversation-graph-completion:p214
          npm run verify:conversation-ui-graph-e2e:p215
          npm run verify:graph-answer-pipeline:p216
          npx tsx scripts/verify_capability_ledger_graph_storage_p295.mjs
          npx tsx scripts/verify_autonomous_state_integrity_p296.mjs
          npx tsx scripts/verify_autonomous_cancel_recovery_p297.mjs

      - name: Build Web Application
        env:
          VITE_MIKI_BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Prepare Android web bundle without Node server
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/server.cjs
          rm -rf dist-apk
          mkdir -p dist-apk
          cp -a dist/. dist-apk/
          rm -f dist-apk/server.cjs dist-apk/server.cjs.map
          if find dist-apk -type f \( -name 'server.cjs' -o -name 'server.cjs.map' \) -print -quit | grep -q .; then
            echo "::error::Node server bundle leaked into dist-apk"
            exit 1
          fi

      - name: Install Japanese morphology (Sudachi) dependency
        run: bash scripts/install_android_japanese_morphology.sh

      - name: Install Android WorkManager / headless-fetch plugin
        run: bash scripts/install_android_workmanager.sh

      - name: Verify Native and runtime failure contracts
        run: |
          npx tsx scripts/verify_complexity_cost_gate_behavior.ts
          node scripts/verify_runtime_failure_fixes.mjs
          npx tsx scripts/verify_runtime_proof_workspace_policy_p328.ts
          npx tsx scripts/verify_android_native_contract.ts
          npx tsx scripts/verify_android_japanese_morphology_contract.ts
          node scripts/verify_rust_core_kernel_phase37.mjs

      - name: Sync Capacitor Android
        env:
          MIKI_CAPACITOR_WEB_DIR: dist-apk
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/public
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          if find android/app/src/main/assets/public -type f \( -name 'server.cjs' -o -name 'server.cjs.map' \) -print -quit | grep -q .; then
            echo "::error::Node server bundle leaked into synced Android assets"
            exit 1
          fi

      - name: Copy model manifest into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp model_manifest.json android/app/src/main/assets/model_manifest.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build Rust native core
        run: npm run build:rust-android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent signing keystore
        working-directory: android
        run: |
          echo "${{ secrets.MIKI_KEYSTORE_BASE64 }}" | base64 -d > app/miki-ai-release.keystore

      - name: Build Android APK
        working-directory: android
        env:
          MIKI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/miki-ai-release.keystore
          MIKI_KEYSTORE_PASSWORD: ${{ secrets.MIKI_KEYSTORE_PASSWORD }}
          MIKI_KEY_ALIAS: ${{ secrets.MIKI_KEY_ALIAS }}
          MIKI_KEY_PASSWORD: ${{ secrets.MIKI_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK excludes unused Node server bundle
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          if unzip -Z1 "$apk" | grep -E '(^|/)(server\.cjs|server\.cjs\.map)$'; then
            echo "::error::Node server bundle was included in the APK"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miki-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK Artifactを作成した後に残りの回帰検査を実行する。
      - name: Post-push repository regression checks
        if: always()
        timeout-minutes: 15
        run: |
          set +e
          failures=0
          : > p258-regression-results.txt

          run_check() {
            name="$1"
            shift
            echo "::group::$name"
            "$@"
            rc=$?
            echo "::endgroup::"
            printf '%s=%s\n' "$name" "$rc" | tee -a p258-regression-results.txt "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              failures=1
            fi
          }

          run_check postpush_import_check npm run check:imports
          run_check postpush_typescript_lint npm run lint
          run_check postpush_conversation_learning npx tsx scripts/verify_conversation_learning_and_reasoning.ts
          run_check postpush_autonomous_infrastructure npx tsx scripts/verify_autonomous_infrastructure_integration.ts

          echo "POSTPUSH_REGRESSION_FAILURES=$failures" | tee -a p258-regression-results.txt "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Upload post-push regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p258-regression-results
          path: p258-regression-results.txt
          if-no-files-found: warn
