          # Create MikiMaintenanceWorker.java (Android WorkManager native background worker)
          cat << 'EOF' > android/app/src/main/java/com/mikiai/app/MikiMaintenanceWorker.java
          package com.mikiai.app;

          import android.content.Context;
          import android.util.Log;
          import androidx.annotation.NonNull;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;
          import java.io.File;

          public class MikiMaintenanceWorker extends Worker {
              private static final String TAG = "MikiMaintenanceWorker";

              public MikiMaintenanceWorker(@NonNull Context context, @NonNull WorkerParameters workerParams) {
                  super(context, workerParams);
              }

              @NonNull
              @Override
              public Result doWork() {
                  Log.i(TAG, "Starting periodic MIKI-AI on-device maintenance work...");
                  try {
                      File cacheDir = getApplicationContext().getCacheDir();
                      if (cacheDir != null && cacheDir.exists()) {
                          File[] files = cacheDir.listFiles();
                          if (files != null) {
                              for (File f : files) {
                                  if (f.getName().endsWith(".tmp") || f.getName().startsWith("temp_")) {
                                      f.delete();
                                  }
                              }
                          }
                      }
                      Log.i(TAG, "Periodic MIKI-AI maintenance work completed successfully.");
                      return Result.success();
                  } catch (Exception e) {
                      Log.e(TAG, "Error executing maintenance work: " + e.getMessage());
                      return Result.retry();
                  }
              }
          }
          EOF

          # Create MikiWorkManagerPlugin.java (Capacitor plugin exposing native Android WorkManager)
          cat << 'EOF' > android/app/src/main/java/com/mikiai/app/MikiWorkManagerPlugin.java
          package com.mikiai.app;

          import android.util.Log;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.concurrent.TimeUnit;

          @CapacitorPlugin(name = "MikiWorkManagerPlugin")
          public class MikiWorkManagerPlugin extends Plugin {
              private static final String TAG = "MikiWorkManagerPlugin";
              private static final String PERIODIC_WORK_NAME = "MikiPeriodicMaintenance";

              @PluginMethod
              public void schedulePeriodicWork(PluginCall call) {
                  int intervalMinutes = call.getInt("intervalMinutes", 60);
                  if (intervalMinutes < 15) intervalMinutes = 15; // Android WorkManager minimum is 15 minutes

                  try {
                      PeriodicWorkRequest workRequest = new PeriodicWorkRequest.Builder(
                              MikiMaintenanceWorker.class,
                              intervalMinutes,
                              TimeUnit.MINUTES
                      ).build();

                      WorkManager.getInstance(getContext()).enqueueUniquePeriodicWork(
                              PERIODIC_WORK_NAME,
                              ExistingPeriodicWorkPolicy.KEEP,
                              workRequest
                      );

                      Log.i(TAG, "Scheduled native WorkManager periodic maintenance every " + intervalMinutes + " minutes");
                      JSObject ret = new JSObject();
                      ret.put("scheduled", true);
                      ret.put("intervalMinutes", intervalMinutes);
                      call.resolve(ret);
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to schedule WorkManager: " + e.getMessage());
                      call.reject("Failed to schedule WorkManager: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void cancelPeriodicWork(PluginCall call) {
                  try {
                      WorkManager.getInstance(getContext()).cancelUniqueWork(PERIODIC_WORK_NAME);
                      Log.i(TAG, "Cancelled native WorkManager periodic maintenance");
                      JSObject ret = new JSObject();
                      ret.put("cancelled", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Failed to cancel WorkManager: " + e.getMessage());
                  }
              }
          }
